[project]
name = "academy"
version = "0.1.0"
description = "Agentic Academy backend API, content pipeline and CLI"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "pyyaml>=6.0",
  "markdown-it-py>=3.0",
  "jsonschema>=4.23",
  "email-validator>=2.2",
]

[project.scripts]
academy = "academy.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-jsonschema",
  "academy-sim",
]

[tool.uv.sources]
academy-sim = { path = "../runner/sandbox-image", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/academy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["academy"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "academy.auth.*",
  "academy.assessments.*",
  "academy.challenges.*",
  "academy.progress.*",
  "academy.content.*",
]
strict = true
